[package]
name = "gold-watcher"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
description = "金瞳 GoldWatcher - 全球黄金市场实时监控与开收盘/价格告警工具"
license = "MIT"
build = "build.rs"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.32.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
directories = "6"
notify-rust = "4.11"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
tray-icon = { version = "0.21", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls", "gzip"] }
tray-icon = { version = "0.21", default-features = false }
winreg = "0.55"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
